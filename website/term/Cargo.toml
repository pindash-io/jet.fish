[workspace]

[package]
name = "term"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "jet.fish terminal screen bridge"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vtty = { git = "https://github.com/pindash-io/vtty.git", rev = "6b541cac93d5025b818012558f33bf2b01959243", default-features = false, features = ["simd-transcode"] }
vtty_screen = { git = "https://github.com/pindash-io/vtty.git", rev = "6b541cac93d5025b818012558f33bf2b01959243" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
