[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# vtty — the byte parser and cell-width model (git, pindash-io/vtty).
vtty = { git = "https://github.com/pindash-io/vtty.git", features = ["simd-transcode"] }
vtty_width = { git = "https://github.com/pindash-io/vtty.git" }

bitflags = "2"
color = "0.3"
compact_str = { version = "0.10.0", default-features = false }
foldhash = "0.2"
glam = "0.34"
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
memchr = "2"
rustix = "1"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "2.0.0-beta.4", features = ["std"] }

hotpath = { version = "0.30.2", default-features = false, features = ["hotpath", "hotpath-alloc", "hotpath-cpu"] }

[workspace.lints]
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(disable_dispatch_sse4_2)",
    "cfg(disable_dispatch_avx2)",
    "cfg(disable_dispatch_avx512)",
] }

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.collection_is_never_read = "warn"
clippy.default_trait_access = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "allow"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"

# ── Profile overrides ─────────────────────────────────────────────────
[profile]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = false

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16

[profile.bench]
inherits = "release"
opt-level = 3

[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
