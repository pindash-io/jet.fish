[package]
name = "jetfish_runtime"
description = "Terminal runtime: the generic Term shell, PTY, input encoding, and the backend registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jetfish_log.workspace = true
jetfish_protocol.workspace = true
jetfish_screen = { workspace = true, default-features = false }

vtty.workspace = true

glam.workspace = true

compact_str.workspace = true
snafu.workspace = true

calloop.workspace = true
libc.workspace = true
rustix = { workspace = true, features = [
    "termios",
    "process",
    "pty",
    "fs",
    "stdio",
    "event",
    "pipe",
] }

[lints]
workspace = true
