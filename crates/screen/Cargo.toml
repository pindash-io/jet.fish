[package]
name = "jetfish_screen"
description = "Screen state model: the cell grid (CellScreen) and the shared main/alt Screen shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["kitty", "iterm2", "sixel", "simd"]
simd = ["jetfish_protocol/simd", "vtty/simd-transcode"]
kitty = ["jetfish_command/kitty", "jetfish_image/kitty"]
iterm2 = ["jetfish_command/iterm2", "jetfish_image/iterm2"]
sixel = ["jetfish_image/sixel"]

[dependencies]
jetfish_command = { workspace = true, default-features = false }
jetfish_image = { workspace = true, default-features = false }
jetfish_protocol.workspace = true

vtty.workspace = true
vtty_status.workspace = true

compact_str.workspace = true
glam.workspace = true

[lints]
workspace = true
